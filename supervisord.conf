[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/bin/bash -c "/usr/lib/postgresql/$(ls /usr/lib/postgresql)/bin/postgres -D $PGDATA"
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:node]
command=node /app/server/index.js
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
environment=NODE_ENV="production",PORT="3000",DATABASE_URL="postgresql://comerciantes:comerciantes@localhost:5432/comerciantes"
